name: 出典の点検

# 毎週月曜 7:23（日本時間）に、出典のURLが開けるか・確認日が90日に近づいていないかを見る
# 問題があれば Issue「出典の点検」に書く（開いた Issue があればコメントを足す）。Claude の使用量は使わない
# この点検を直す PR では、Issue は作らず結果だけ出す

on:
  schedule:
    - cron: '23 22 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check-sources.mjs'
      - '.github/workflows/check-sources.yml'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 出典を開いてみる
        id: chk
        run: |
          if node scripts/check-sources.mjs > report.md; then echo "ng=0" >> "$GITHUB_OUTPUT"; else echo "ng=1" >> "$GITHUB_OUTPUT"; fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          # 画面の注記にも出す（スマホの GitHub でも見える）
          echo "::notice title=出典の点検::$(head -1 report.md)"
          grep '^- ' report.md | head -40 | while IFS= read -r l; do echo "::warning title=出典の点検::$l"; done

      - name: Issue に書く
        if: steps.chk.outputs.ng == '1' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "出典の点検" --color D93F0B --description "毎週の出典の点検" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "出典の点検" --state open --json number --jq '.[0].number')
          if [ -n "$N" ]; then
            gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body-file report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "出典の点検：直すところがあります" --label "出典の点検" --body-file report.md
          fi
