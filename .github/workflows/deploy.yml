name: Build and Deploy

# テスト → ビルド → 全ページ点検 → Cloudflare Pages へ直接アップロード（Direct Upload）
# Cloudflare 側ではビルドしないので、アカウント共有の「月500回のビルド枠」を使わない
#   main への push        → 本番（https://anzen-benricho.com）。公開のあと、変わったページを IndexNow で知らせる
#   毎月1日と15日 9:10（日本時間）→ 本番を作り直す（今月のテーマ・法改正の「施行済み」・トップの「次の改正」を切りかえる）
#   プルリクエスト        → プレビュー（PRにURLをコメント）
#   毎日 5:41（日本時間）   → 本番を作り直す（そろえる物のページの楽天の商品を取りなおす。#66）
# そろえる物のページの楽天の商品は、ビルドの前に毎回とりなおす（scripts/fetch-rakuten.mjs）
#   取ったものはコミットしない・ログに出さない・成果物（artifacts）に上げない（公開リポジトリのため。楽天ウェブサービス規約 第10条9号）。ログと注記は呼び出しの回数と件数だけ
#   main と作り直しで取れなければ止める（公開しない。前の公開がそのまま残る）。Secrets のない PR は取らずに、商品の節を出さずにビルドする

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 0 1,15 * *'
    - cron: '41 20 * * *'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PROJECT: anzen-benricho

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: テスト
        run: npm test

      - name: 楽天の商品を取る（件数だけ出す）
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          REQUIRE_RAKUTEN: ${{ github.event_name != 'pull_request' && '1' || '0' }}
        run: node scripts/fetch-rakuten.mjs

      - name: ビルド
        env:
          REQUIRE_RAKUTEN: ${{ github.event_name != 'pull_request' && '1' || '0' }}
        run: npm run build

      - name: 全ページ点検
        run: npm run verify

      - name: Cloudflare Pages へアップロード
        # フォークからのPRには秘密情報が渡らないので、アップロードしない
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          # 初回だけ Pages のプロジェクトを作る（すでにあれば何もしない）
          if ! npx --yes wrangler@4 pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi
          npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true | tee deploy.log
          grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' deploy.log | sort -u > urls.txt || true
          {
            echo "### Cloudflare Pages（$BRANCH）"
            sed 's/^/- /' urls.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 前に知らせたページの記録を読む（IndexNow）
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - name: 変わったページを検索エンジンに知らせる（IndexNow。Bing など）
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/indexnow.mjs

      - name: 記録をとっておく（IndexNow）
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}

      - name: PRにプレビューURLをコメント
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ALIAS=$(grep -v -E '^https://[0-9a-f]{8}\.' urls.txt | head -1)
          [ -n "$ALIAS" ] || ALIAS=$(head -1 urls.txt)
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "プレビュー：$ALIAS
          （コミット ${SHA::7}。このブランチに push するたびに同じURLが新しくなります）"
