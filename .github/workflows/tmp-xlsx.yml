# 一時的：労働安全衛生総合研究所の一覧から次亜塩素酸ナトリウムの行を取り出す（PR をマージする前に消す）
name: tmp-xlsx
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/tmp-xlsx.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取り出す
        run: |
          set -u
          mkdir w && cd w
          B=https://cheminfo.johas.go.jp/step/
          curl -fsSL -A 'Mozilla/5.0' -o list.html ${B}list.html || echo "::notice title=err::list.html"
          curl -fsSL -A 'Mozilla/5.0' -o search.js ${B}js/search.js
          grep -noE "(ajax|fetch|getJSON|url|\.csv|\.json|\.txt|\.php|data)[^;]{0,120}" search.js | head -20 | tr '\n' '~' | sed 's/%/%25/g' | awk '{print "::notice title=js::" $0}'
