# 一時的：厚労省の一覧の Excel から次亜塩素酸ナトリウムの行を取り出す（PR をマージする前に消す）
name: tmp-xlsx
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/tmp-xlsx.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取り出す
        run: |
          set -eu
          curl -fsSL -A 'Mozilla/5.0' -o list.xlsx https://www.mhlw.go.jp/content/11300000/001708896.xlsx
          pip install -q openpyxl
          python3 - <<'PY'
          import openpyxl
          wb = openpyxl.load_workbook('list.xlsx', read_only=True, data_only=True)
          def esc(s): return s.replace('%', '%25').replace('\r', '').replace('\n', ' / ')
          print('::notice title=sheets::' + esc(' | '.join(wb.sheetnames)))
          for ws in wb.worksheets:
              rows = list(ws.iter_rows(values_only=True))
              head = []
              for r in rows[:7]:
                  cells = [str(c).strip() for c in r if c not in (None, '')]
                  if cells: head.append(' ; '.join(cells))
              hits = []
              for i, r in enumerate(rows):
                  txt = [str(c).strip() if c is not None else '' for c in r]
                  if any(('次亜塩素酸' in t) or ('7681-52-9' in t) for t in txt):
                      hits.append(f'R{i+1}: ' + ' ; '.join(f'[{j}]{t}' for j, t in enumerate(txt) if t))
              if ws.title.startswith('R9.4'):
                  notes = [' ; '.join(str(c).strip() for c in r if c not in (None, '')) for r in rows if any(str(c).strip().startswith(('＊', '※', '注')) for c in r[:2] if c is not None)]
                  print('::notice title=notes::' + esc(' || '.join(notes))[:30000])
              if hits:
                  msg = 'HEAD ' + ' // '.join(head) + ' ||| ' + ' || '.join(hits)
                  print(f'::notice title={esc(ws.title)}::' + esc(msg)[:30000])
          PY
