# 一時的：労働安全衛生総合研究所の一覧から次亜塩素酸ナトリウムの行を取り出す（PR をマージする前に消す）
name: tmp-xlsx
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/tmp-xlsx.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取り出す
        run: |
          set -u
          mkdir w && cd w
          B=https://cheminfo.johas.go.jp/step/
          curl -fsSL -A 'Mozilla/5.0' -o list.csv ${B}csv/list.csv
          python3 - <<'PY'
          b = open('list.csv','rb').read()
          for enc in ('utf-8-sig','cp932'):
              try: t = b.decode(enc); break
              except Exception: pass
          lines = t.splitlines()
          hits = [l for l in lines if '7681-52-9' in l or '次亜塩素酸ナトリウム' in l]
          def e(x): return x.replace('%','%25')
          print('::notice title=csvhead::' + e(' // '.join(lines[:2]))[:4000])
          print('::notice title=csvhit::' + e(' // '.join(hits))[:4000])
          print('::notice title=csvlen::' + str(len(lines)))
          PY
