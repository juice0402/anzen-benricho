# 一時的：労働安全衛生総合研究所の一覧から次亜塩素酸ナトリウムの行を取り出す（PR をマージする前に消す）
name: tmp-xlsx
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/tmp-xlsx.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取り出す
        run: |
          set -u
          mkdir w && cd w
          B=https://cheminfo.johas.go.jp/step/
          curl -fsSL -A 'Mozilla/5.0' -o list.html ${B}list.html || echo "::notice title=err::list.html"
          python3 - <<'PY'
          import re, subprocess, urllib.parse
          html = open('list.html', encoding='utf-8', errors='replace').read()
          refs = sorted(set(re.findall(r'''(?:src|href)=["']([^"'#]+\.(?:js|json|csv|txt|xlsx))["']''', html) + re.findall(r'''["']([^"'\s]+\.(?:json|csv))["']''', html)))
          print('::notice title=refs::' + ' | '.join(refs)[:3000])
          base = 'https://cheminfo.johas.go.jp/step/list.html'
          seen = set()
          def get(u):
              n = 'f%d' % len(seen); seen.add(u)
              subprocess.run(['curl', '-fsSL', '-A', 'Mozilla/5.0', '-o', n, u])
              try: return open(n, encoding='utf-8', errors='replace').read()
              except Exception: return ''
          for r in refs:
              u = urllib.parse.urljoin(base, r)
              if 'cheminfo.johas.go.jp' not in u: continue
              t = get(u)
              for m in re.finditer(r'''["']([^"'\s]+\.(?:json|csv))["']''', t):
                  u2 = urllib.parse.urljoin(u, m.group(1))
                  if 'cheminfo.johas.go.jp' in u2 and u2 not in seen:
                      t2 = get(u2)
                      for k in [x.start() for x in re.finditer('7681-52-9', t2)][:3]:
                          print('::notice title=' + u2.split('/')[-1] + '::' + t2[max(0,k-300):k+300].replace('\n',' / ').replace('%','%25'))
              for k in [x.start() for x in re.finditer('7681-52-9', t)][:3]:
                  print('::notice title=' + u.split('/')[-1] + '::' + t[max(0,k-300):k+300].replace('\n',' / ').replace('%','%25'))
          for k in [x.start() for x in re.finditer('7681-52-9', html)][:3]:
              print('::notice title=list.html::' + html[max(0,k-300):k+300].replace('\n',' / ').replace('%','%25'))
          PY
